name: Build tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid xz make || true
          echo "ldid: $(command -v ldid || echo none)"

      - name: Install Theos + iPhoneOS 16.5 SDK
        run: |
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Show environment
        run: |
          echo "theos: $THEOS"
          ls "$THEOS/makefiles" | head -5
          cat control

      - name: Build package (arm64e / roothide)
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide ARCHS=arm64e

      - name: Inspect product
        run: |
          ls -l packages
          DYLIB=$(find .theos -name '*.dylib' -type f | head -1)
          echo "dylib: $DYLIB"
          if [ -n "$DYLIB" ]; then file "$DYLIB"; otool -hv "$DYLIB"; otool -L "$DYLIB"; fi

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilesFullName-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.0.8"
          NOTES="FilesFullName 0.0.8（arm64e / roothide / iOS 15-16）

- 注入 com.apple.DocumentsApp（系统「文件」App）
- 长文件名不再「名称头…名称尾」，改为按字符换行，列表行高自动增高
- 列表视图不限行数，网格视图默认 2 行
- 偏好：Enabled / GridEnabled / ShrinkToFit / ResizeRows / ListMaxLines / GridMaxLines / ShowLoadAlert
- 装上后 respring，打开「文件」App 会弹一次 FilesFullName 加载确认框"
          gh release create "$TAG" packages/*.deb \
            --repo "$GITHUB_REPOSITORY" \
            --title "FilesFullName 0.0.8" \
            --notes "$NOTES" \
          || gh release upload "$TAG" packages/*.deb --repo "$GITHUB_REPOSITORY" --clobber
