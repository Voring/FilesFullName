name: Build tweak

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15-intel
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid xz make

      - name: Install Theos (roothide scheme)
        run: |
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Build package (arm64e / roothide)
        run: |
          make clean
          make package FINALPACKAGE=1

      - name: Inspect product
        run: |
          ls -l packages
          DYLIB=$(find .theos/obj -maxdepth 2 -name '*.dylib' | head -1)
          echo "dylib: $DYLIB"
          file "$DYLIB"
          otool -hv "$DYLIB"
          otool -L "$DYLIB"

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: FilesFullName-deb
          path: packages/*.deb
