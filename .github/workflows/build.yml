name: Build tweak

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          brew install ldid xz make dpkg || true
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos (roothide fork) and iPhoneOS 16.5 SDK
        run: |
          set -o pipefail
          {
            git clone --depth 1 https://github.com/roothide/theos.git "$THEOS"
            git -C "$THEOS" submodule update --init --recursive || echo "submodules partially unavailable, continuing"
            git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
            mkdir -p "$THEOS/sdks"
            cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
            echo "$THEOS/bin" >> "$GITHUB_PATH"
            ls "$THEOS/makefiles/package/schemes" || true
          } 2>&1 | tee install.log

      - name: Build package
        run: |
          set -o pipefail
          make package FINALPACKAGE=1 2>&1 | tee build.log

      - name: Report build error
        if: failure()
        run: |
          if [ -f build.log ]; then
            tail -c 1200 build.log | tr '\n' ' ' > /tmp/msg
            echo "::error::BUILD: $(cat /tmp/msg)"
          elif [ -f install.log ]; then
            tail -c 1200 install.log | tr '\n' ' ' > /tmp/msg
            echo "::error::INSTALL: $(cat /tmp/msg)"
          else
            echo "::error::no log produced"
          fi

      - name: Inspect product
        if: success()
        run: |
          ls -l packages
          DYLIB=$(find .theos -name '*.dylib' -type f | head -1)
          echo "dylib: $DYLIB"
          if [ -n "$DYLIB" ]; then
            file "$DYLIB"
            otool -hv "$DYLIB"
            otool -L "$DYLIB"
          fi

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FilesFullName-deb
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release
        if: success() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.0.11
          name: FilesFullName 0.0.11
          body: |
            arm64e / roothide（RootHide、Dopamine）构建，iOS 15-16。

            - 修复切到图标（网格）视图闪退：不再在 UICollectionViewCell 的布局回调里改视图
            - 修复文件图标被多行文件名拉高：图标异步钳制回方形尺寸
            - 长文件名按字符换行，仅作用于宽列表行，网格视图不受影响
            - 移除开屏注入成功弹窗，加载时完全静默
            - 偏好键：Enabled / ShrinkToFit / WrapLines / KeepIconSize / ListMaxLines
          files: packages/*.deb
          fail_on_unmatched_files: true
